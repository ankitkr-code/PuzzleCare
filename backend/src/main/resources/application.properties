spring.application.name=puzzle-game-backend

# --- Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/puzzle_game?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- File uploads ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- App settings ---
# Randomly generated at scaffold time. Generate a fresh one for production:
#   openssl rand -base64 48
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000
app.upload.dir=uploads
